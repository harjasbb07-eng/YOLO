<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container bg-white p-5 rounded shadow-sm max-w-lg">
        <h2>Submit Code</h2>
        <div id="verdictAlert" class="alert d-none"></div>
        
        <form id="submissionForm">
            <select id="assignmentSelect" class="form-select mb-3" required></select>
            <input type="text" id="rollNo" class="form-control mb-3" placeholder="Roll Number" required>
            <input type="text" id="name" class="form-control mb-3" placeholder="Name" required>
            <textarea id="sourceCode" class="form-control mb-3 font-monospace" rows="10" placeholder="Paste C++ Code Here" required></textarea>
            <button type="submit" class="btn btn-success w-100">Submit & Run Test Cases</button>
        </form>
    </div>

    <script>
        fetch('http://localhost:8080/api/assignments')
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('assignmentSelect');
                data.forEach(a => select.innerHTML += `<option value="${a.id}">${a.title}</option>`);
            });

        document.getElementById('submissionForm').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                assignmentId: parseInt(document.getElementById('assignmentSelect').value),
                studentRollNo: document.getElementById('rollNo').value,
                studentName: document.getElementById('name').value,
                sourceCode: document.getElementById('sourceCode').value
            };
            
            const res = await fetch('http://localhost:8080/api/submissions', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            
            const alertBox = document.getElementById('verdictAlert');
            alertBox.classList.remove('d-none', 'alert-success', 'alert-danger', 'alert-warning');
            
            if (data.verdict === 'AC') {
                alertBox.classList.add('alert-success');
            } else if (data.verdict === 'WA' || data.verdict === 'CE' || data.verdict === 'RE') {
                alertBox.classList.add('alert-danger');
            } else if (data.verdict === 'TLE') {
                alertBox.classList.add('alert-warning');
            }
            alertBox.innerText = `Verdict: ${data.verdict}`;
        };
    </script>
</body>
</html>
