# Server Configuration
server.port=8080

# Application Name
spring.application.name=yolo-portal

# Max Upload Size Configuration (Handling large source files if submitted)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Allow clean serving of static frontend HTML/JS files
spring.web.resources.static-locations=classpath:/static/